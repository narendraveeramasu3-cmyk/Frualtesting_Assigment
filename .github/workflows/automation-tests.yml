
name: Frugal Testing Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  q1-ui-automation:
    name: Q1 - SauceDemo UI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: FrugalTesting_Assignment/Q1_UI_Automation/pom.xml

      - name: Run Selenium tests
        working-directory: FrugalTesting_Assignment/Q1_UI_Automation
        run: mvn --batch-mode clean test -Dheadless=true

      - name: Upload Q1 test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Q1-Selenium-Reports
          path: |
            FrugalTesting_Assignment/Q1_UI_Automation/reports/
            FrugalTesting_Assignment/Q1_UI_Automation/target/surefire-reports/
          if-no-files-found: warn

  q2-api-automation:
    name: Q2 - Restful Booker API Automation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: FrugalTesting_Assignment/Q2_API_Automation/pom.xml

      - name: Run RestAssured tests
        working-directory: FrugalTesting_Assignment/Q2_API_Automation
        run: mvn --batch-mode clean test

      - name: Upload Q2 test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Q2-RestAssured-Reports
          path: |
            FrugalTesting_Assignment/Q2_API_Automation/target/surefire-reports/
          if-no-files-found: warn
